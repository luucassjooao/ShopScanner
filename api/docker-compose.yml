name: shopscanner

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopscanner
      POSTGRES_PASSWORD: shopscanner
      POSTGRES_DB: shopscanner
    ports:
      - '5432:5432'
    volumes:
      - shopscanner-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopscanner -d shopscanner']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Sem Dockerfile: em desenvolvimento a imagem oficial basta e o código vem do volume.
    # bookworm (não alpine) porque o argon2 tem binário pronto para glibc.
    image: node:22-bookworm-slim
    working_dir: /app
    # As variáveis vêm daqui, não de .env: por isso o node roda sem --env-file.
    command: sh -c "npm install && npm run db:migrate && node --watch src/index.ts"
    environment:
      NODE_ENV: development
      PORT: 3333
      # Dentro do contêiner precisa ouvir em todas as interfaces para a porta publicada funcionar.
      HOST: 0.0.0.0
      # Os segredos abaixo têm padrão de desenvolvimento, público aqui. Em produção o
      # boot recusa esses valores: não suba produção com este arquivo sem trocá-los.
      DATABASE_URL: postgres://shopscanner:shopscanner@db:5432/shopscanner
      JWT_SECRET: ${JWT_SECRET:-desenvolvimento-troque-isto-com-32-chars}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-desenvolvimento-troque-isto-32-chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - '3333:3333'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  shopscanner-db:
